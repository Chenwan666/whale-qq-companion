<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鲸鱼 · 第一次见面</title>
<style>*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#edf7fc;color:#24485f;font:16px/1.7 system-ui,sans-serif}main{max-width:720px;margin:auto;background:white;border:1px solid #d6eaf5;border-radius:28px;padding:36px;box-shadow:0 16px 50px #165e7a0d}h1{margin:0;font-size:30px}p{color:#537587}label{display:block;margin-top:18px;font-weight:600}input,select{display:block;width:100%;padding:12px;border:1px solid #c7dfec;border-radius:10px;font:inherit;color:inherit;background:#fbfdff}input:focus,select:focus{outline:3px solid #d5eefc;border-color:#4e9cc4}small{font-weight:400;color:#658291}button{margin-top:28px;padding:12px 24px;border:0;border-radius:14px;background:#247eaa;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}details{margin:20px 0;padding:16px;background:#f3f9fc;border-radius:14px}#status{white-space:pre-wrap}a{color:#247eaa}@media(max-width:560px){main{padding:24px}.row{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){body{background:#12232d;color:#d5ecf9}main{background:#193440;border-color:#315463}p,small{color:#a2c0d0}input,select,details{background:#122a36;color:#def2ff;border-color:#416576}}</style>
<main><div style="font-size:42px" aria-hidden="true">🐳</div><h1>给小鲸鱼一个新家</h1><p>这份分享包从空白开始。填写你自己的账号和 API，原作者的角色卡、记忆和密钥都不在这里。</p>
<form id="setup"><label>你的管理员 QQ 号<input name="ownerQQ" inputmode="numeric" required pattern="[1-9][0-9]{4,11}" autocomplete="off"></label>
<label>你自己的 DeepSeek API Key <small>可暂留空，之后到 AI 后台填写</small><input name="apiKey" type="password" autocomplete="new-password" placeholder="只保存到本机，不回显"></label>
<p>模型调用由你自己的服务商计费；保存不会发起付费测试。默认先安静陪聊，不会自动刷网页或发帖。</p>
<details><summary>QQ 接入设置（SnowLuma / OneBot v11）</summary><p>先自行安装接入端、登录机器人 QQ，启用 OneBot HTTP 和 WebSocket。这里不安装或打包 QQ 接入软件。</p><div class="row"><label>HTTP 地址<input name="httpUrl" value="http://127.0.0.1:3000" required></label><label>WebSocket 地址<input name="wsUrl" value="ws://127.0.0.1:3001" required></label></div><label>接入端 Access Token<input name="gatewayToken" type="password" autocomplete="new-password"></label></details>
__VOICE_FORM__
<button type="submit">保存并继续启动</button><p id="status" role="status" aria-live="polite"></p></form>
<p><small>这是仅监听本机的设置窗口。电脑休眠或关闭程序后不会继续聊天。修改或备份前，请阅读包内操作手册。</small></p></main>
<script>document.getElementById('setup').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),status=document.getElementById('status');b.disabled=true;status.textContent='正在保存到本机…';try{const r=await fetch('/save',{method:'POST',headers:{'content-type':'application/json','x-setup-token':'__CSRF__'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'未保存');status.textContent='已保存。请回到启动窗口查看进度，完成后会打开小窝。'+(data.configuredModel?'':String.fromCharCode(10)+'尚未填写模型 API Key；请先到 AI 后台 → Settings → Models 配置，聊天才可用。');}catch(error){status.textContent=error.message;b.disabled=false;}};</script></html>
