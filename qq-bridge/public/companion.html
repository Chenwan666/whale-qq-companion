<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鲸鱼的小窝</title>
<style>
:root{color-scheme:light;--ink:#223a4a;--muted:#617a89;--blue:#17617e;--line:#dce7e9}*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button,a.button{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 14px;color:var(--ink);cursor:pointer;text-decoration:none}button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #70b9ce;outline-offset:3px}.primary{background:var(--blue);color:white;border-color:var(--blue)}header{max-width:1140px;margin:38px auto 22px;padding:0 24px;display:flex;gap:16px;align-items:center}.mark{width:58px;height:58px;border-radius:18px;background:#dceef1;display:grid;place-items:center;font-size:32px}h1{margin:0;font-size:28px;letter-spacing:-1px}p{margin:4px 0;color:var(--muted)}header .button{margin-left:auto}.layout{max-width:1140px;margin:auto;padding:0 24px 60px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 22px}.stat strong{font-size:25px;display:block}.stat span{color:var(--muted);font-size:13px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:28px 0 16px}.tabs button{background:transparent;border-color:transparent}.tabs button[aria-selected=true]{background:#e0eef0;color:var(--blue);border-color:#c6e0e5}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;min-height:320px}.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}input,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);background:#fff}input{min-width:160px;flex:1}textarea{width:100%;min-height:110px}.list{display:grid;gap:12px}.card{border:1px solid var(--line);border-radius:12px;padding:18px}.card h3{font-size:16px;margin:0 0 8px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.meme img{display:block;width:150px;height:150px;object-fit:contain;margin:8px auto;background:#f5f8f8;border-radius:10px}.meme .content{font-size:13px}#notice{min-height:28px;margin:12px 0;color:var(--blue)}#notice.error{color:#aa3c43}.empty{padding:50px 20px;text-align:center;color:var(--muted)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;width:min(520px,90vw);color:var(--ink)}dialog::backdrop{background:#19333b55}dialog h2{margin-top:0;font-size:21px}dialog label{display:block;margin:12px 0}dialog input{width:100%}.browsertext{max-height:400px;overflow:auto;background:#f5f8f8;padding:18px;border-radius:10px}small{color:var(--muted)}@media(max-width:650px){header{margin-top:22px}.stats{grid-template-columns:repeat(2,1fr)}.panel{padding:16px}header .button{font-size:12px;padding:6px}.toolbar input{width:100%}h1{font-size:23px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
.panel>.card{margin-bottom:14px}.rolecard,.profile-memory{margin-top:16px}.rolecard{padding:16px;border-radius:10px;background:#f4f8f8;max-height:480px;overflow:auto}.card>.button,.card>button{margin:4px 8px 4px 0}
</style><link rel="stylesheet" href="/whale-theme.css"></head><body>
<header><div class="mark" aria-hidden="true"><img src="/whale-home.svg" alt="" width="150" height="150"></div><div class="hero-copy"><span class="eyebrow">A LITTLE OCEAN, JUST FOR YOU</span><h1>小鲸鱼的小窝</h1><p>把日常、声音和想记住的小事，都轻轻收在这里。</p><div class="hero-tags"><span>蓝白鲸鱼娘</span><span>记忆各自珍藏</span><span>新会话自动安家</span></div></div><a href="/" class="button">桥接控制台 ↗</a></header>
<main class="layout"><div class="stats"><div class="stat"><strong id="memoryCount">—</strong><span>最近展示的记忆</span></div><div class="stat"><strong id="memeCount">—</strong><span>最近收藏的表情</span></div><div class="stat"><strong id="dayCount">—</strong><span>有聊天记录的日期</span></div><div class="stat"><strong id="runState">—</strong><span>主动搭话</span></div></div>
<nav class="tabs" aria-label="小窝功能"><span class="nav-group">日常小窝</span><button data-tab="overview" aria-selected="true">运行总览</button><button data-tab="memories" aria-selected="false">记忆档案</button><button data-tab="memes" aria-selected="false">表情收藏</button><button data-tab="voices" aria-selected="false">音色管理</button><button data-tab="growth" aria-selected="false">人格成长</button><button data-tab="diary" aria-selected="false">每日记录</button><button data-tab="music" aria-selected="false">音乐偏好</button><span class="nav-group">QQ相处</span><button data-tab="permissions" aria-selected="false">会话权限</button><button data-tab="profiles" aria-selected="false">角色与会话</button><button data-tab="groups" aria-selected="false">群主与申请</button><button data-tab="social" aria-selected="false">QQ互动</button><button data-tab="workbench" aria-selected="false">QQ工作台</button><button data-tab="qzone" aria-selected="false">空间草稿</button><span class="nav-group">探索与管理</span><button data-tab="browser" aria-selected="false">网页探索</button><button data-tab="surf" aria-selected="false">上网笔记</button><button data-tab="audio" aria-selected="false">音频读取</button><button data-tab="downloads" aria-selected="false">下载库</button><button data-tab="memoryArchives" aria-selected="false">所有记忆</button></nav>
<div class="statusbar"><p id="serviceStatus" role="status"></p><p id="voiceStatus" role="status"></p><div id="notice" role="status" aria-live="polite"></div></div><details class="task-progress" id="taskProgress">
<summary><span class="task-progress-icon" aria-hidden="true">◷</span><span>任务进度</span><small>刷帖 · 回复 · 写帖</small></summary>
<div class="task-progress-body">
<div class="task-kind-picker" role="group" aria-label="任务类型"><button type="button" data-task-kind="surf" aria-pressed="true">刷帖</button><button type="button" data-task-kind="replies" aria-pressed="false">回复评论</button><button type="button" data-task-kind="posts" aria-pressed="false">写帖与发布</button></div>
<div class="task-progress-top"><p data-task-message>展开后读取任务；收起时暂停刷新。</p><button type="button" data-task-refresh>刷新进度</button></div>
<div data-task-view hidden><div class="task-progress-heading"><h2 data-task-title>刷帖任务</h2><span data-task-status role="status"></span></div>
<div class="task-progress-meter"><progress max="100" value="0" aria-label="已核实阅读进度"></progress><strong data-task-percent>0%</strong></div>
<div class="task-progress-stats"><div><small data-task-count-label>已核实阅读</small><strong data-task-count>—</strong></div><div><small data-task-elapsed-label>已用时</small><strong data-task-elapsed>—</strong></div><div><small data-task-remaining-label>剩余时限</small><strong data-task-remaining>—</strong></div></div>
<pre class="task-progress-terminal" tabindex="0" aria-label="任务详细状态"></pre></div>
<p class="task-progress-help">刷帖、回复与写帖分别显示进度。此处只读；发布仍按本篇确认和手动交接规则执行。</p>
</div></details><section class="panel" id="panel"></section>
</main><dialog id="login"><h2>打开小鲸鱼的小窝</h2><p>使用本地桥接控制台的访问令牌。</p><form id="loginForm"><label>访问令牌<input id="loginToken" type="password" autocomplete="off" required></label><button class="primary">进入小窝</button></form></dialog>
<dialog id="edit"><h2>更正这条记忆</h2><form id="editForm"><label>主题<input id="editSubject" required readonly maxlength="100"></label><label>内容<textarea id="editContent" required maxlength="600"></textarea></label><div class="toolbar"><button class="primary">保存更正</button><button type="button" id="cancelEdit">取消</button></div></form></dialog>

<script>
const initialTab=['voices','singing','growth','android','permissions'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';
const launchToken=new URLSearchParams(location.search).get('token');
if(launchToken){localStorage.setItem('consoleToken',launchToken);history.replaceState(null,'','/companion'+location.hash);}
let key='',data={},status={},profiles=[],extensions=[],downloads=[],tab=initialTab,editing=null;
const $=id=>document.getElementById(id),make=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':'';}
async function api(url,body,options={}){const r=await fetch(url,{method:body?'POST':'GET',signal:options.signal||AbortSignal.timeout(url==='/api/status'?5000:180000),headers:{'x-console-token':localStorage.getItem('consoleToken')||'','content-type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(r.status===401){if(!$('login').open)$('login').showModal();throw Error('请先输入本地控制台访问令牌');}if(!r.ok||d.ok===false)throw Error(d.error||'请求失败');return d;}
async function call(action,body={}){return(await api('/api/socialV2/companion/'+action,{key,...body})).data;}
function button(text,fn,cls){const b=make('button',text,cls);b.type='button';b.onclick=async()=>{b.disabled=true;notice('正在处理…');try{await fn();}catch(e){notice(e.message,true);}finally{b.disabled=false;}};return b;}
function card(title,content){const e=make('article',undefined,'card');e.append(make('h3',title),make('div',content,'content'));return e;}
function empty(text){$('panel').append(make('div',text,'empty'));}
async function refresh(){try{const s=await api('/api/status');status=s;key='private:'+s.ownerQQ;$('serviceStatus').textContent=(s.dshReady?'● AI已就绪':'○ AI正在连接')+' · '+(s.snowluma?.accountOnline?'QQ小号已在线':'QQ小号未在线，请登录并检查SnowLuma接入')+' · '+(s.mode==='closed-agent'?'电脑任务模式':'陪聊模式');data=await call('dashboard');[profiles,extensions,downloads]=await Promise.all([call('profiles'),call('extension-list'),call('downloads')]);const v=data.voice;const voiceLabel=v?.engine==='doubao'?'豆包语音':v?.engine==='local'?'瑶瑶本地语音':'晓伊在线语音';$('voiceStatus').textContent=!v||v.state==='unknown'?voiceLabel+'：尚未检测':v.state==='ready'?voiceLabel+'：上次合成成功':voiceLabel+'：'+(v.reason||'暂不可用')+(v.coolingDown?'，约'+Math.ceil((v.retryAfter-Date.now())/60000)+'分钟后可重试':'，下次使用时重试')+' · 文字聊天和语音识别正常';if(v?.delivery){const labels={'uncertain':'QQ发送失败或送达未确认','sent':'QQ语音已送达','sending':'正在发送到QQ','generating':'正在合成语音','generation-failed':'语音合成失败，未发送到QQ'};$('voiceStatus').textContent+=' · '+(labels[v.delivery.status]||v.delivery.status);}$('memoryCount').textContent=data.memories.length;$('memeCount').textContent=data.memes.length;$('dayCount').textContent=data.days.length;$('runState').textContent=data.proactivePaused?'休息中':'已开启';render();notice('已读取本机数据 · '+new Date().toLocaleTimeString());}catch(e){$('serviceStatus').textContent='○ 未能确认服务状态 · '+new Date().toLocaleTimeString()+' · '+e.message;notice(e.message,true);}}
function toolbar(){const e=make('div',undefined,'toolbar');$('panel').append(e);return e;}
async function preview(row,e){try{const r=await call('meme-preview',{id:row.id});const img=make('img');img.alt=row.description;img.src='data:'+r.image.mimeType+';base64,'+r.image.data;e.prepend(img);}catch(error){e.append(make('small','预览不可用：'+error.message));}}
async function showImageInbox(){
 const inbox=await call('meme-inbox'),list=$('memeList');list.replaceChildren();
 list.append(make('p','待审核 '+inbox.total+' 张：表情包和普通图片都会自动收集，只有通过的图片才进入共用表情库。重复图片合并；这里每次展示最近30张。'));
 for(const row of inbox.items){
  const contexts={browsing:'刷帖收集','reply-inbox':'按消息回复时收集','reply-post':'按帖子回复时收集'};
  const origin=row.sourceKind==='online-browsing'?(contexts[row.collectionContext]||'网上收图'):'来自QQ '+row.userId;
  const e=card('待审核 · '+row.id,row.key+' · '+origin+' · '+Math.ceil(row.bytes/1024)+'KB');e.classList.add('meme');
  if(row.sourceExcerpt)e.append(make('p',row.sourceExcerpt.slice(0,250),'meta'));
  for(const source of row.sources?.length?row.sources:row.sourceUrl?[{sourceUrl:row.sourceUrl}]:[]){try{const u=new URL(source.sourceUrl);if(u.protocol!=='https:'||u.username||u.password)continue;const a=make('a','查看来源帖子');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';e.append(a);}catch{}}
  e.append(button('预览待审核图片',async()=>{const image=await call('meme-review-preview',{id:row.id});let img=e.querySelector('img');if(!img){img=make('img');img.alt='收到的待审核图片';e.prepend(img);}img.src='data:'+image.image.mimeType+';base64,'+image.image.data;}));
  const description=make('input');description.placeholder='可选用途：开心、抱抱、无语……';description.setAttribute('aria-label','图片用途描述');
  const tags=make('input');tags.placeholder='标签，逗号分隔';tags.setAttribute('aria-label','图片标签');e.append(description,tags);
  e.append(button('通过并加入共用库',async()=>{await call('meme-review',{id:row.id,approve:true,description:description.value,tags:tags.value.split(/[,，]/).map(t=>t.trim()).filter(Boolean)});data.memes=await call('meme-list');await showImageInbox();notice('图片已通过，小鲸鱼可在许可会话中使用');}),button('拒绝收录',async()=>{await call('meme-review',{id:row.id,approve:false});await showImageInbox();notice('已拒绝，不会供小鲸鱼发送');}));list.append(e);
 }
 for(const failure of inbox.captureFailures||[])list.append(card('图片收集未完成',failure.key+' · '+failure.error));
}
async function showVoices(){return renderVoiceSettings({panel:$('panel'),call,notice,make,button,card,isActive:()=>tab==='voices'});}
function render(){const panel=$('panel');panel.replaceChildren();const bar=toolbar();bar.append(button('刷新',refresh));
 if(['overview','permissions','profiles','extensions','downloads','social','memoryArchives','workbench','groups'].includes(tab))renderManagement(tab,panel,bar);
 if(tab==='android'){void renderAndroidDevice({panel,call,notice,make,button,card,isActive:()=>tab==='android'}).catch(e=>notice(e.message,true));}
 if(tab==='growth'){void renderPersonaGrowth({panel,call,notice,make,button,card,isActive:()=>tab==='growth'}).catch(e=>notice(e.message,true));}
 if(tab==='singing'){void renderSinging({panel,call,notice,make,button,card,isActive:()=>tab==='singing'}).catch(e=>notice(e.message,true));}
 if(tab==='voices'){void showVoices().catch(e=>notice(e.message,true));}
 if(tab==='memories'){const q=make('input');q.placeholder='搜索喜好、称呼或约定';q.setAttribute('aria-label','搜索记忆');const run=async()=>{const rows=await call('recall',{query:q.value,limit:30});drawMemories(rows);notice('找到 '+rows.length+' 条记忆');};bar.prepend(q,button('查找',run));q.onkeydown=e=>{if(e.key==='Enter')run().catch(x=>notice(x.message,true));};const list=make('div',undefined,'list');list.id='memoryList';panel.append(list);drawMemories(data.memories);}
 if(tab==='memes'){const q=make('input');q.placeholder='试试：抱抱、开心、害羞';q.setAttribute('aria-label','表情关键词');bar.prepend(button('全部已收录',async()=>{data.memes=await call('meme-list',{all:true});drawMemes(data.memes,false);$('memeCount').textContent=data.memes.length;notice('已显示全部收录图片，共 '+data.memes.length+' 张');}),button('审核收到的图片',showImageInbox));bar.prepend(q,button('联网找表情',async()=>{const r=await call('meme-search',{query:q.value});drawMemes(r.results,true);notice(r.note);}));const list=make('div',undefined,'grid');list.id='memeList';panel.append(list);drawMemes(data.memes,false);}
 if(tab==='diary'){const date=make('input');date.type='date';date.value=data.days.at(-1)||new Date().toLocaleDateString('en-CA');date.setAttribute('aria-label','日记日期');bar.prepend(date,button('查看日记',async()=>{const d=await call('diary',{date:date.value});$('diaryContent').textContent=d?d.summary:'这天尚未生成日记。';notice('日期：'+date.value);}));panel.append(make('p','每天 23:00 整理当天聊天，漏掉的日期会补归档。'),make('div','选择日期，查看已经生成的日记。','content'));panel.lastChild.id='diaryContent';}
 if(tab==='qzone'){panel.append(make('p','发布需在 QQ 私聊发送对应命令；这里先查看全文和可见范围。'));if(!data.drafts.length)empty('还没有空间草稿');for(const d of data.drafts){const e=card(({draft:'待发布',published:'已发布',uncertain:'结果待核对',publishing:'发布中'}[d.status]||d.status)+' · '+({self:'仅自己',friends:'好友',public:'公开'}[d.visibility]),d.content);e.append(make('div',d.id+' · '+new Date(d.createdAt).toLocaleString(),'meta'));if(d.status==='draft')e.append(make('div','QQ 私聊命令：/空间发布 '+d.id,'meta'));panel.append(e);}}
 if(tab==='music'){if(!data.music.length)empty('还没有音乐偏好。告诉小鲸鱼你喜欢或不喜欢哪首歌。');for(const s of data.music)panel.append(card((s.status==='like'?'喜欢':s.status==='dislike'?'不喜欢':'已取消偏好')+' · '+s.title,s.artist||''));}
 if(tab==='surf'){panel.append(make('p','保存实际读过的页面，保留出处和时间；网上的内容不会自动变成管理员的个人记忆。'));if(!data.surf?.length)empty('还没有上网笔记。让小鲸鱼浏览后记下有趣的页面，或在网页探索中保存。');for(const r of data.surf||[]){const e=card(r.title,r.note||r.excerpt.slice(0,600));e.append(make('div',new Date(r.time).toLocaleString(),'meta'));const a=make('a','查看来源');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';e.append(a);panel.append(e);}}
 if(tab==='audio'){const input=make('input');input.placeholder='公开音频直链，或管理员私聊发来的音频消息ID';input.setAttribute('aria-label','音频链接或消息ID');const draw=r=>{const view=$('audioContent');view.replaceChildren();view.append(make('h3','实际读取结果'));const m=r.metadata||{};for(const [label,value]of [['歌名',m.title?.join('、')],['歌手',m.artist?.join('、')],['专辑',m.album?.join('、')],['时长',r.durationSeconds?r.durationSeconds.toFixed(1)+' 秒':''],['编码',r.codec],['来源',r.source]])if(value)view.append(make('p',label+'：'+value));view.append(make('div',r.text||'没有得到可确认的人声文字。','content'),make('p',r.note||'转写可能有误，不能当作听歌识曲。'));};const read=async transcribe=>{notice(transcribe?'正在识别人声，可能需要一两分钟……':'正在读取文件信息……');draw(await call('audio-read',/^https?:\/\//i.test(input.value.trim())?{url:input.value.trim(),transcribe}:{messageId:input.value.trim(),transcribe}));notice('音频读取完成');};bar.prepend(input,button('只读音乐信息',()=>read(false)),button('识别人声',()=>read(true)));panel.append(make('p','可读取文件里的歌名、歌手、专辑、时长和编码。人声只分析前120秒，歌唱容易识别错；不是听歌识曲。下载上限20MB，临时文件处理后删除。'));const view=make('div',undefined,'content');view.id='audioContent';panel.append(view);}
 if(tab==='browser'){bar.append(button('保存当前页面',async()=>{await call('surf-save',{note:''});notice('已保存当前页面的真实标题、摘录和来源。');await refresh();}));}
 if(tab==='browser'){const url=make('input');url.placeholder='公开网页地址或搜索词';url.setAttribute('aria-label','网页地址或搜索词');const draw=drawBrowser;bar.prepend(url,button('打开网页',async()=>{draw(await call('browser-open',{url:url.value}));notice('网页已打开');}),button('联网搜索',async()=>{draw(await call('browser-search',{query:url.value}));notice('搜索完成');}));bar.append(button('往下滚动',async()=>draw(await call('browser-scroll',{direction:'down'}))),button('看截图',async()=>{const r=await call('browser-screenshot');const img=make('img');img.alt='当前网页截图';img.style='max-width:100%;display:block';img.src='data:image/png;base64,'+r.image.data;$('browserContent').replaceChildren(img);notice('已获取当前网页画面');}),button('关闭网页',async()=>{await call('browser-close');draw({opened:false});notice('浏览器已关闭');}));panel.append(make('p','这里浏览公开网页；需要点击、输入或登录状态的任务，在 QQ 使用 /agent。'));const view=make('div',undefined,'browsertext');view.id='browserContent';panel.append(view);draw(data.browser);}
}
function drawBrowser(r){const view=$('browserContent');view.replaceChildren();if(!r?.opened){view.append(make('p','还没有网页任务。输入网址或关键词开始探索。'));return;}view.append(make('h3',r.title||'当前网页'),make('div',r.url,'meta'),make('div',r.text,'content'));for(const link of r.links||[])view.append(button(link.text,async()=>{drawBrowser(await call('browser-follow',{id:link.id}));notice('已打开所选链接');}));}
function drawMemories(rows){const list=$('memoryList');list.replaceChildren();if(!rows.length)list.append(make('p','没有匹配的记忆。'));for(const m of rows){const e=card(m.subject,m.content);e.append(make('div',m.category+' · '+m.source+' · '+new Date(m.updatedAt).toLocaleString(),'meta'),button('更正',async()=>{editing=m;$('editSubject').value=m.subject;$('editContent').value=m.content;$('edit').showModal();notice('更正后，下次聊天使用新内容。');}));list.append(e);}}
function drawMemes(rows,search){
 const list=$('memeList');list.replaceChildren();
 if(!rows.length)list.append(make('p',search?'没找到匹配表情。':'还没有本地表情收藏。'));
 for(const m of rows){
  const e=card(m.emotion||'表情',m.description);e.classList.add('meme');
  if(!search)preview(m,e);
  e.append(make('div',(m.tags||[]).slice(0,5).join(' · '),'meta'));
  e.append(button(search?'收藏到本地':'发给管理员',async()=>{if(search){await call('meme-save',{id:m.id});notice('已收藏到本地');}else{await call('meme-send',{id:m.id});notice('图片已发到 QQ 私聊');}}));
  if(!search){
   const confirmation=make('div');confirmation.hidden=true;
   confirmation.append(make('p','从共用库删除此图片？以后再次收到时需要重新审核。'));
   const removeButton=button('删除图片',async()=>{confirmation.hidden=false;removeButton.hidden=true;confirmation.querySelector('button').focus();});
   confirmation.append(button('确认删除',async()=>{
    const result=await call('meme-delete',{id:m.id,confirm:true});
    data.memes=await call('meme-list',{all:true});drawMemes(data.memes,false);$('memeCount').textContent=data.memes.length;
    notice(result.cleanupPending?'已从共用库移除；缓存文件清理失败，小鲸鱼已无法调用此图片。':'图片已删除，小鲸鱼不会再从共用库调用它');
    $('panel').querySelector('button')?.focus();
   }),button('取消',async()=>{confirmation.hidden=true;removeButton.hidden=false;removeButton.focus();notice('已取消删除');}));
   e.append(removeButton,confirmation);
  }
  list.append(e);
 }
}
mountWhaleTaskProgress({read:async(kind,signal)=>{if(!key)throw Error('等待小窝登录并读取服务状态');const action={surf:'surf-status',replies:'comment-reply-status',posts:'post-status'}[kind];return(await api('/api/socialV2/companion/'+action,{key,...(kind==='surf'?{}:{progress:true})},{signal})).data;}});

document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;history.replaceState(null,'','/companion#'+encodeURIComponent(tab));document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render();});
$('cancelEdit').onclick=()=>$('edit').close();$('editForm').onsubmit=async e=>{e.preventDefault();try{await call('remember',{subject:$('editSubject').value,content:$('editContent').value,category:editing.category});$('edit').close();await refresh();}catch(x){notice(x.message,true);}};
$('loginForm').onsubmit=e=>{e.preventDefault();localStorage.setItem('consoleToken',$('loginToken').value.trim());$('loginToken').value='';$('login').close();refresh();};document.querySelector('header a').onclick=e=>{e.preventDefault();location.href='/?token='+encodeURIComponent(localStorage.getItem('consoleToken')||'');};refresh();setInterval(()=>{if(!document.hidden&&!$('login').open)checkServiceStatus();},15000);
